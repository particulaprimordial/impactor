
name: Build Particula Impact Engine VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile VST3
        run: cmake --build build --config Release --parallel 2

      - name: Package VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
            Select-Object -First 1

          if (-not $plugin) {
            Write-Host "Build contents:"
            Get-ChildItem build -Recurse
            throw "VST3 plugin was not found."
          }

          Compress-Archive -Path $plugin.FullName `
            -DestinationPath "$env:GITHUB_WORKSPACE\Particula-Impact-Engine-VST3.zip"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Particula-Impact-Engine-Windows-VST3
          path: Particula-Impact-Engine-VST3.zip
